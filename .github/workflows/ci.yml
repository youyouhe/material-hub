name: CI/CD

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Python 后端 ----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 后端 lint (ruff)
        run: |
          pip install ruff
          ruff check backend/

      - name: 后端依赖安装
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 后端 import 检查
        run: |
          cd backend
          python -c "
          import importlib
          mods = ['main', 'dms_models', 'dms_processor', 'dms_search', 'llm_provider',
                  'kb_database', 'kb_models', 'kb_ingest', 'kb_search', 'kb_multihop',
                  'kb_graph', 'kb_extraction', 'kb_entity_sync', 'kb_event_ingest',
                  'kb_chunking', 'kb_embedding', 'kb_asr', 'kb_docx', 'chat_tools']
          failed = []
          for m in mods:
              try: importlib.import_module(m)
              except Exception as e: failed.append((m, str(e)[:80]))
          if failed:
              for m, e in failed: print(f'  ✗ {m}: {e}')
              raise SystemExit(f'❌ {len(failed)} 个模块导入失败')
          print(f'✓ {len(mods)} 个核心模块导入成功')
          "

      # ---- Node 前端 ----
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端依赖安装
        run: |
          cd frontend
          npm ci

      - name: 前端类型检查 (tsc)
        run: |
          cd frontend
          npx tsc --noEmit

      - name: 前端构建 (vite build)
        run: |
          cd frontend
          npm run build

  # ============================================================
  # deploy — 仅 main 分支推送，SSH 到服务器执行 Docker Compose 部署
  # ============================================================
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 部署到远程服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/material-hub
            echo "==> 当前版本: $(git rev-parse --short HEAD)"
            echo "==> 拉取最新代码..."
            git pull origin main
            echo "==> 新版本: $(git rev-parse --short HEAD)"
            echo "==> 构建并启动..."
            docker compose up -d --build
            echo "==> 等待健康检查..."
            for i in $(seq 1 20); do
              if curl -sf http://127.0.0.1:8101/health > /dev/null 2>&1; then
                echo "✓ Backend healthy ($(($i))s)"
                exit 0
              fi
              sleep 1
            done
            echo "✗ 健康检查超时"
            docker compose logs --tail=30 backend
            exit 1
